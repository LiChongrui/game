<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>漩涡风暴样式候选 · 第二批 6 款</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #F5F4F0; color: #2C2C2A; padding: 28px 16px 48px; max-width: 780px; margin: 0 auto;
  }
  h1 { font-size: 20px; font-weight: 500; }
  .sub { font-size: 13px; color: #5F5E5A; margin-top: 6px; line-height: 1.7; }
  .panel {
    margin-top: 14px; background: #FFFFFF; border: 0.5px solid rgba(0,0,0,.14);
    border-radius: 12px; padding: 12px 14px 14px;
  }
  .phead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .pid { font-size: 15px; font-weight: 500; color: #0C447C; }
  .pname { font-size: 13px; color: #444441; }
  .ptag { font-size: 12px; color: #888780; margin-left: auto; }
  .pnote { font-size: 12px; color: #5F5E5A; margin-top: 4px; line-height: 1.6; }
  canvas { width: 100%; height: 230px; display: block; border-radius: 10px; background: #0E3A5A; margin-top: 8px; }
  footer {
    margin-top: 18px; font-size: 12px; color: #888780; line-height: 1.7;
    background: #EDEBE4; border-radius: 8px; padding: 10px 12px;
  }
  footer b { color: #444441; font-weight: 500; }
</style>
</head>
<body>
  <h1>漩涡风暴样式候选 · 第二批</h1>
  <p class="sub">六个新方向（与第一批 A-E 思路不同）：不再"画线条漩涡"，改从<b>生物 / 叙事 / 质感</b>入手。回复编号即可（如「用 G」），实施范围同前：仅替换游戏内漩涡绘制分支，位置 / 半径 / 时长 / 卷力物理不动。</p>
  <div id="panels"></div>
  <footer>
    <b>方向说明</b>：F 荧光浮游靠粒子差速旋转自然"涌"出漩涡，最像活的深海发光水；G 鲸影与 J 鱼群饵球是真实海洋奇观；H 水纹与 K 墨纹走质感极简；I 单只海月水母是单体主角式优雅。可任意组合（如「G 鲸影 + H 水纹做尾流」）。
  </footer>

<script>
function sea(ctx, w, h) {
  ctx.fillStyle = '#0E3A5A';
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let y = 24; y < h; y += 42) {
    ctx.beginPath();
    for (let x = 0; x <= w; x += 10) {
      const yy = y + Math.sin(x * 0.02 + y) * 3;
      x === 0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }
}
function glowDot(ctx, x, y, r, rgb, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, 'rgba(' + rgb + ',' + a + ')');
  g.addColorStop(1, 'rgba(' + rgb + ',0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}

// ---- F 荧光浮游：粒子差速旋转，自然涌现漩涡 ----
const F_PS = [];
for (let i = 0; i < 90; i++) {
  const r = 0.12 + Math.pow(Math.random(), 0.75) * 0.88;
  F_PS.push({
    a0: Math.random() * 6.283, r: r,
    sp: (2.2 / (0.3 + r)) * (0.8 + Math.random() * 0.4),
    sz: 1 + Math.random() * 2.2, warm: Math.random() < 0.25
  });
}
function drawF(ctx, w, h, t) {
  sea(ctx, w, h);
  const cx = w / 2, cy = h / 2, R = Math.min(w, h) * 0.4;
  glowDot(ctx, cx, cy, 55, '140,220,230', 0.3);
  ctx.lineCap = 'round';
  F_PS.forEach(function (p) {
    const r = p.r * R;
    const aa = p.a0 + t * p.sp;
    for (let k = 0; k < 5; k++) {                       // 彗尾：5 个渐隐残影
      const baa = aa - k * 0.035;
      const x = cx + Math.cos(baa) * r, y = cy + Math.sin(baa) * r * 0.82;
      const a = (1 - k / 5) * (0.35 + 0.45 * Math.sin(t * 2 + p.a0 * 3));
      ctx.beginPath();
      ctx.fillStyle = p.warm ? 'rgba(190,240,250,' + Math.max(0, a) + ')' : 'rgba(150,225,235,' + Math.max(0, a) + ')';
      ctx.arc(x, y, p.sz * (1 - k * 0.15), 0, 7); ctx.fill();
    }
  });
  ctx.beginPath();
  ctx.fillStyle = 'rgba(235,250,255,' + (0.5 + 0.15 * Math.sin(t * 2.5)) + ')';
  ctx.arc(cx, cy, 4, 0, 7); ctx.fill();
}

// ---- G 鲸影环游：半透明鲸影缓绕 + 尾流旋涡 ----
function drawG(ctx, w, h, t) {
  sea(ctx, w, h);
  const cx = w / 2, cy = h / 2, R = Math.min(w, h) * 0.36;
  glowDot(ctx, cx, cy, 40, '120,190,230', 0.25);
  const a = t * 0.3;
  const wx = cx + Math.cos(a) * R, wy = cy + Math.sin(a) * R * 0.5 + Math.sin(t * 1.3) * 4;
  // 尾流：沿轨道后方渐隐弧
  for (let k = 1; k <= 7; k++) {
    const ba = a - k * 0.09;
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(168,221,245,' + (0.35 * (1 - k / 8)) + ')';
    ctx.lineWidth = 5 * (1 - k / 9);
    ctx.arc(cx, cy, R, ba - 0.05, ba + 0.05);
    ctx.stroke();
    if (k % 2 === 0) {                                   // 尾流气泡
      const bx = cx + Math.cos(ba) * (R + 8), by = cy + Math.sin(ba) * R * 0.5;
      ctx.beginPath();
      ctx.fillStyle = 'rgba(207,234,249,' + (0.4 * (1 - k / 8)) + ')';
      ctx.arc(bx, by - k * 2, 2, 0, 7); ctx.fill();
    }
  }
  // 鲸影（朝行进方向）
  const L = 108;
  ctx.save();
  ctx.translate(wx, wy);
  ctx.rotate(a + Math.PI / 2 + Math.sin(t * 1.1) * 0.05);
  ctx.beginPath();
  ctx.moveTo(L * 0.5, 0);
  ctx.bezierCurveTo(L * 0.35, -L * 0.17, -L * 0.2, -L * 0.15, -L * 0.42, -L * 0.05);
  ctx.bezierCurveTo(-L * 0.54, -L * 0.18, -L * 0.64, -L * 0.12, -L * 0.55, 0);
  ctx.bezierCurveTo(-L * 0.64, L * 0.12, -L * 0.54, L * 0.18, -L * 0.42, L * 0.05);
  ctx.bezierCurveTo(-L * 0.2, L * 0.14, L * 0.3, L * 0.14, L * 0.5, 0);
  ctx.fillStyle = 'rgba(22,62,96,0.6)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(170,220,246,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.beginPath();                                       // 胸鳍
  ctx.moveTo(L * 0.08, L * 0.06);
  ctx.quadraticCurveTo(-L * 0.02, L * 0.16, -L * 0.1, L * 0.1);
  ctx.strokeStyle = 'rgba(170,220,246,0.4)'; ctx.stroke();
  ctx.beginPath();                                       // 眼
  ctx.fillStyle = 'rgba(190,230,250,0.8)';
  ctx.arc(L * 0.36, -L * 0.02, 1.8, 0, 7); ctx.fill();
  ctx.restore();
}

// ---- H 漩涡水纹：同心波纹自内向外扩散扭曲 ----
function drawH(ctx, w, h, t) {
  sea(ctx, w, h);
  const cx = w / 2, cy = h / 2, R = Math.min(w, h) * 0.4;
  glowDot(ctx, cx, cy, 36, '170,225,245', 0.35);
  for (let k = 0; k < 6; k++) {
    const prog = (t * 0.32 + k / 6) % 1;
    const r = 10 + prog * R;
    const fade = Math.sin(prog * Math.PI);               // 出生渐显、末段渐隐
    ctx.beginPath();
    for (let i = 0; i <= 48; i++) {
      const aa = i / 48 * 2 * Math.PI;
      const rr = r + Math.sin(aa * 5 + t * 1.6 + k) * 3 * (1 - prog * 0.5);
      const x = cx + Math.cos(aa) * rr, y = cy + Math.sin(aa) * rr * 0.72;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(178,226,246,' + (0.55 * fade) + ')';
    ctx.lineWidth = 1 + 2.2 * (1 - prog);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.fillStyle = 'rgba(235,250,255,' + (0.55 + 0.2 * Math.sin(t * 3)) + ')';
  ctx.arc(cx, cy, 3.5, 0, 7); ctx.fill();
}

// ---- I 海月水母：单只大海月水母脉动悬浮 ----
function drawI(ctx, w, h, t) {
  sea(ctx, w, h);
  const cx = w / 2, cy = h / 2 - 8 + Math.sin(t * 0.9) * 7;
  const jr = Math.min(w, h) * 0.2;
  const pulse = 1 + 0.06 * Math.sin(t * 2);
  glowDot(ctx, cx, cy, jr * 2.1, '150,210,240', 0.3);
  for (let i = 0; i < 6; i++) {                          // 环境气泡
    const p = (t * 0.25 + i / 6) % 1;
    ctx.beginPath();
    ctx.fillStyle = 'rgba(207,234,249,' + (0.3 * (1 - p)) + ')';
    ctx.arc(cx + Math.sin(i * 2.4) * jr * 2.4, h - 10 - p * (h - 30), 1.6 + p, 0, 7); ctx.fill();
  }
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(1, pulse);
  const dome = ctx.createRadialGradient(0, -jr * 0.3, 2, 0, 0, jr);
  dome.addColorStop(0, 'rgba(225,243,255,0.95)');
  dome.addColorStop(0.7, 'rgba(170,215,245,0.55)');
  dome.addColorStop(1, 'rgba(140,195,235,0.3)');
  ctx.fillStyle = dome;
  ctx.beginPath(); ctx.arc(0, 0, jr, Math.PI, 0); ctx.quadraticCurveTo(0, jr * 0.18, -jr, 0); ctx.fill();
  ctx.strokeStyle = 'rgba(220,240,255,0.7)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.3)';               // 海月四环内纹
  for (let k = 0; k < 4; k++) {
    ctx.beginPath();
    ctx.arc(-jr * 0.5 + k * jr * 0.33, -jr * 0.38, jr * 0.15, 0, 7); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(200,232,250,0.4)'; ctx.lineWidth = 1.1;   // 长须
  for (let k = 0; k < 9; k++) {
    const bx = -jr * 0.85 + k * jr * 0.21;
    ctx.beginPath(); ctx.moveTo(bx, jr * 0.08);
    for (let s = 1; s <= 7; s++) {
      ctx.lineTo(bx + Math.sin(t * 2.6 + k + s * 0.7) * (3 + s * 0.8), jr * 0.08 + s * 9);
    }
    ctx.stroke();
  }
  ctx.lineWidth = 2.4;                                   // 口腕（4 条粗飘带）
  ctx.strokeStyle = 'rgba(225,244,255,0.5)';
  for (let k = 0; k < 4; k++) {
    const bx = -jr * 0.3 + k * jr * 0.2;
    ctx.beginPath(); ctx.moveTo(bx, jr * 0.1);
    for (let s = 1; s <= 5; s++) {
      ctx.lineTo(bx + Math.sin(t * 1.8 + k * 1.5 + s) * 5, jr * 0.1 + s * 12);
    }
    ctx.stroke();
  }
  ctx.restore();
}

// ---- J 鱼群饵球：数十尾小鱼差速成球 ----
const J_FISH = [];
for (let i = 0; i < 56; i++) {
  const r = 0.15 + Math.pow(Math.random(), 0.7) * 0.85;
  J_FISH.push({ a0: Math.random() * 6.283, r: r, sp: (2.4 / (0.3 + r)), sz: 2.5 + Math.random() * 2 });
}
function drawJ(ctx, w, h, t) {
  sea(ctx, w, h);
  const cx = w / 2, cy = h / 2, R = Math.min(w, h) * 0.4;
  glowDot(ctx, cx, cy, 50, '130,200,235', 0.22);
  ctx.lineCap = 'round';
  J_FISH.forEach(function (f) {
    const r = f.r * R;
    const aa = f.a0 + t * f.sp;
    const x = cx + Math.cos(aa) * r, y = cy + Math.sin(aa) * r * 0.75;
    const tx = -Math.sin(aa), ty = Math.cos(aa) * 0.75;  // 切向（运动方向）
    const n = Math.hypot(tx, ty), ux = tx / n, uy = ty / n;
    const a = 0.4 + 0.45 * Math.sin(t * 3 + f.a0 * 5);
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(205,230,248,' + a + ')';
    ctx.lineWidth = f.sz * 0.55;
    ctx.moveTo(x - ux * f.sz * 1.4, y - uy * f.sz * 1.4); // 鱼身：短线段
    ctx.lineTo(x + ux * f.sz * 1.4, y + uy * f.sz * 1.4);
    ctx.stroke();
  });
  ctx.beginPath();                                       // 中心幽光
  ctx.fillStyle = 'rgba(235,250,255,' + (0.35 + 0.15 * Math.sin(t * 2.5)) + ')';
  ctx.arc(cx, cy, 3.5, 0, 7); ctx.fill();
}

// ---- K 墨涡流纹：多层波纹环慢旋交融如大理石 ----
function drawK(ctx, w, h, t) {
  sea(ctx, w, h);
  const cx = w / 2, cy = h / 2, R = Math.min(w, h) * 0.42;
  glowDot(ctx, cx, cy, 44, '170,225,245', 0.3);
  for (let j = 0; j < 9; j++) {
    const r0 = 12 + j * (R - 24) / 8;
    const amp = 4 + j * 2.2;
    const ph = t * (0.5 - j * 0.04) + j * 1.7;
    ctx.beginPath();
    for (let i = 0; i <= 60; i++) {
      const aa = i / 60 * 2 * Math.PI;
      const rr = r0 + Math.sin(aa * 3 + ph) * amp + Math.sin(aa * 7 - ph * 1.4) * amp * 0.4;
      const x = cx + Math.cos(aa) * rr, y = cy + Math.sin(aa) * rr * 0.8;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = j % 2 ? 'rgba(126,195,232,0.16)' : 'rgba(190,232,250,0.13)';
    ctx.lineWidth = 7 - j * 0.4;
    ctx.stroke();
  }
  ctx.beginPath();                                       // 一道白高光环
  for (let i = 0; i <= 60; i++) {
    const aa = i / 60 * 2 * Math.PI;
    const rr = R * 0.55 + Math.sin(aa * 3 - t * 0.7) * 7;
    const x = cx + Math.cos(aa) * rr, y = cy + Math.sin(aa) * rr * 0.8;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
  ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.beginPath();
  ctx.fillStyle = 'rgba(240,250,255,0.85)';
  ctx.arc(cx, cy, 4, 0, 7); ctx.fill();
}

const DESIGNS = [
  { id: 'F', name: '荧光浮游', tag: '生物发光 · 活水感', note: '90 颗发光粒子差速旋转（内快外慢）自然涌现漩涡，每颗带彗尾拖影，无一条画出来的"线"。', draw: drawF },
  { id: 'G', name: '鲸影环游', tag: '大物叙事 · 记忆点', note: '半透明鲸影绕场缓游，尾后拖出渐隐旋涡尾流与气泡——漩涡是"被鲸搅出来的"。', draw: drawG },
  { id: 'H', name: '漩涡水纹', tag: '禅意 · 极简', note: '同心水波自内向外扩散、边缘轻微扭曲，安静但有压迫感。', draw: drawH },
  { id: 'I', name: '海月水母', tag: '单体主角 · 优雅', note: '一只大海月水母脉动悬浮：四环内纹 + 9 长须 + 4 口腕飘带，躯体随呼吸缩放。', draw: drawI },
  { id: 'J', name: '鱼群饵球', tag: '群游涌现 · 海洋生态', note: '56 尾银色小鱼差速绕游成球（内快外慢），鱼身沿运动方向摆尾——真实海洋奇观"饵球"。', draw: drawJ },
  { id: 'K', name: '墨涡流纹', tag: '水墨 · 大理石纹', note: '九层波纹环慢速交融（相位错动），如墨滴在水里旋开的大理石纹，一道白高光环点睛。', draw: drawK }
];

const main = document.getElementById('panels');
const items = [];
DESIGNS.forEach(function (d) {
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML =
    '<div class="phead"><span class="pid">' + d.id + '</span>' +
    '<span class="pname">' + d.name + '</span>' +
    '<span class="ptag">' + d.tag + '</span></div>' +
    '<div class="pnote">' + d.note + '</div>';
  const cv = document.createElement('canvas');
  panel.appendChild(cv);
  main.appendChild(panel);
  items.push({ cv: cv, draw: d.draw });
});

function frame(now) {
  const t = now / 1000;
  items.forEach(function (it) {
    const dpr = window.devicePixelRatio || 1;
    const cw = it.cv.clientWidth, ch = it.cv.clientHeight;
    if (it.cv.width !== Math.round(cw * dpr)) {
      it.cv.width = Math.round(cw * dpr);
      it.cv.height = Math.round(ch * dpr);
    }
    const ctx = it.cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    it.draw(ctx, cw, ch, t);
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
